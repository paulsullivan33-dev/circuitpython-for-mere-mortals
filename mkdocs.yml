site_name: CircuitPython for Mere Mortals
site_description: Python that runs on a microcontroller board the size of a thumb. Writing code.py, letting the board run it the moment you save, stocking the lib folder with circup, checking code at your desk before it ever meets hardware, and the honest boundary between what a desk can prove and what only a board can, stated plainly.
site_url: https://paulsullivan33-dev.github.io/circuitpython-for-mere-mortals/
